# One-time setup (e.g., install system tools, global CLIs).
initialize:
  - name: install Android SDK (platform 36, build-tools 35.0.0)
    run: |
      export ANDROID_HOME="$HOME/android-sdk"
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        curl -fsSLo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
        rm -rf "$ANDROID_HOME/cmdline-tools/latest"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
        rm -f /tmp/cmdtools.zip
      fi
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0" > /dev/null
      echo "ANDROID_HOME=$ANDROID_HOME" >> $ENVRC
      echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $ENVRC
      echo 'PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"' >> $ENVRC
  - name: add Maven Central mirror (repo.maven.apache.org returns HTTP 429 from Devin VMs)
    run: |
      mkdir -p "$HOME/.gradle/init.d"
      cat > "$HOME/.gradle/init.d/maven-central-mirror.gradle" <<'EOF'
      def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
      beforeSettings { settings ->
          settings.pluginManagement.repositories { maven { url mirror } }
          settings.dependencyResolutionManagement.repositories { maven { url mirror } }
      }
      EOF
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  chmod +x gradlew
  ./gradlew --no-daemon :app:dependencies > /dev/null
knowledge:
  - name: build
    contents: |
      ./gradlew :app:assembleDebug --no-daemon --max-workers=2   # APK: app/build/outputs/apk/debug/app-debug.apk
  - name: test
    contents: |
      ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2   # device tests: ./gradlew :app:connectedDebugAndroidTest (needs emulator/adb device)
  - name: lint
    contents: |
      ./gradlew :app:lintDebug --no-daemon --max-workers=2
  - name: notes
    contents: |
      Release signing needs SIGNING_STORE_FILE/SIGNING_STORE_PASSWORD/SIGNING_KEY_ALIAS/SIGNING_KEY_PASSWORD (optional; debug builds need none). Runtime chat/image API keys are entered in the app UI.
