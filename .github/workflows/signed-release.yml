name: Signed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing store
        env:
          STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
        run: |
          test -n "$STORE_BASE64" || { echo "Configure signing secrets first"; exit 1; }
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/musechat.jks"
      - name: Build signed release
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/musechat.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --max-workers=2
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MuseChat-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Remove temporary signing store
        if: always()
        run: rm -f "$RUNNER_TEMP/musechat.jks"
